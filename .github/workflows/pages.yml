# Build the web version and publish it to GitHub Pages. Nothing built is ever
# committed. Nix provides the tools; make does the build, exactly as locally.
#
#   build (matrix: jspi, asyncify)  — one runner per wasm variant, in parallel.
#                                     Each needs its own OpenCASCADE build
#                                     (different C++ exception model), which
#                                     is the slow part on a cold cache.
#   site                            — combine both into dist/site; deploy on main.
#
# Caching: each expensive component has its own cache entry keyed only on the
# files that determine it. Entries are restored up front and saved at the end
# *even if the build failed, timed out or was cancelled*, so a cold OpenCASCADE
# build is never wasted.
name: web

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Never cancel a main build (it may be filling the cache); do cancel stale PR builds.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - async: jspi
            eh: wasmeh
          - async: asyncify
            eh: jseh
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v31

      # Lean comes from elan, pinned by ./lean-toolchain. Not cached: the
      # toolchain is ~2.8 GB unpacked and downloads about as fast as a restore.
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache keys
        id: keys
        run: |
          v=${{ matrix.async }} eh=${{ matrix.eh }}
          {
            echo "occt=occt-web-$eh-${{ hashFiles('flake.lock', 'scripts/build-occt.sh') }}"
            echo "libuv=libuv-web-$eh-${{ hashFiles('flake.lock', 'scripts/build-libuv-web.sh') }}"
            echo "stdlib=stdlib-c-${{ hashFiles('lean-toolchain', 'scripts/gen-stdlib-c.sh') }}"
            echo "emcache=emcache-$v-${{ hashFiles('flake.lock') }}"
            echo "leanlibs=leanlibs-$v-${{ hashFiles('flake.lock', 'lean-toolchain', 'scripts/gen-stdlib-c.sh', 'Makefile', 'mk/archive.mk', 'config.mk') }}"
          } >> "$GITHUB_OUTPUT"

      - name: Restore OpenCASCADE
        id: occt
        uses: actions/cache/restore@v4
        with: { path: ".toolchain/occt-web-${{ matrix.eh }}/install", key: "${{ steps.keys.outputs.occt }}" }
      - name: Restore libuv
        id: libuv
        uses: actions/cache/restore@v4
        with: { path: ".toolchain/libuv-web-${{ matrix.eh }}/out/libuv.a", key: "${{ steps.keys.outputs.libuv }}" }
      - name: Restore Init as C
        id: stdlib
        uses: actions/cache/restore@v4
        with: { path: ".toolchain/stdlib-c-*", key: "${{ steps.keys.outputs.stdlib }}" }
      - name: Restore emscripten cache
        id: emcache
        uses: actions/cache/restore@v4
        with: { path: .toolchain/emcache, key: "${{ steps.keys.outputs.emcache }}" }
      - name: Restore compiled Lean runtime + Init
        id: leanlibs
        uses: actions/cache/restore@v4
        with:
          path: |
            build/web-${{ matrix.async }}/include
            build/web-${{ matrix.async }}/rt
            build/web-${{ matrix.async }}/libleanrt.a
            build/web-${{ matrix.async }}/libInit.a
          key: ${{ steps.keys.outputs.leanlibs }}

      - name: Build (${{ matrix.async }})
        run: nix develop --command make -j"$(nproc)" TARGET=web ASYNC=${{ matrix.async }}

      - uses: actions/upload-artifact@v4
        with:
          name: web-${{ matrix.async }}
          path: |
            dist/web-${{ matrix.async }}/gears.js
            dist/web-${{ matrix.async }}/gears.wasm
          if-no-files-found: error

      # --- save whatever finished, even if the build failed or was cancelled ---
      - name: Save OpenCASCADE
        if: always() && steps.occt.outputs.cache-hit != 'true' && hashFiles(format('.toolchain/occt-web-{0}/install/.complete', matrix.eh)) != ''
        uses: actions/cache/save@v4
        with: { path: ".toolchain/occt-web-${{ matrix.eh }}/install", key: "${{ steps.keys.outputs.occt }}" }
      - name: Save libuv
        if: always() && steps.libuv.outputs.cache-hit != 'true' && hashFiles(format('.toolchain/libuv-web-{0}/out/libuv.a', matrix.eh)) != ''
        uses: actions/cache/save@v4
        with: { path: ".toolchain/libuv-web-${{ matrix.eh }}/out/libuv.a", key: "${{ steps.keys.outputs.libuv }}" }
      - name: Save Init as C
        # Both matrix jobs may try; the second save is a harmless "already exists".
        if: always() && steps.stdlib.outputs.cache-hit != 'true' && hashFiles('.toolchain/stdlib-c-*/.stamp') != ''
        uses: actions/cache/save@v4
        with: { path: ".toolchain/stdlib-c-*", key: "${{ steps.keys.outputs.stdlib }}" }
      - name: Save emscripten cache
        if: always() && steps.emcache.outputs.cache-hit != 'true' && hashFiles('.toolchain/emcache/ports/**') != ''
        uses: actions/cache/save@v4
        with: { path: .toolchain/emcache, key: "${{ steps.keys.outputs.emcache }}" }
      - name: Save compiled Lean runtime + Init
        if: always() && steps.leanlibs.outputs.cache-hit != 'true' && hashFiles(format('build/web-{0}/libInit.a', matrix.async)) != '' && hashFiles(format('build/web-{0}/libleanrt.a', matrix.async)) != ''
        uses: actions/cache/save@v4
        with:
          path: |
            build/web-${{ matrix.async }}/include
            build/web-${{ matrix.async }}/rt
            build/web-${{ matrix.async }}/libleanrt.a
            build/web-${{ matrix.async }}/libInit.a
          key: ${{ steps.keys.outputs.leanlibs }}

  site:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: actions/download-artifact@v4
        with: { name: web-jspi, path: dist/web-jspi }
      - uses: actions/download-artifact@v4
        with: { name: web-asyncify, path: dist/web-asyncify }
      - name: Assemble site
        run: nix develop .#site --command scripts/assemble-site.sh dist/web-jspi dist/web-asyncify dist/site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
